name: Build firmware

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Get MeshCore version
        run: |
          VERSION=$(sed -nE 's/^#define[[:space:]]+FIRMWARE_VERSION[[:space:]]+"([^"]+)".*/\1/p' MeshCore/examples/companion_radio/MyMesh.h)
          if [ -z "$VERSION" ]; then
            echo "Could not determine FIRMWARE_VERSION from MeshCore/examples/companion_radio/MyMesh.h" >&2
            exit 1
          fi
          echo "MESHCORE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MeshCore version: $VERSION"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Replace COMMIT_HASH in build.sh
        run: |
          sed -i -E 's/^([[:space:]]*)COMMIT_HASH=.*/\1COMMIT_HASH=latest/' MeshCore/build.sh

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.MESHCORE_VERSION }}
          DISABLE_DEBUG: 1
        run: /usr/bin/env bash MeshCore/build.sh build-firmware cardputer_adv_companion_radio_ble

      - name: Update GitHub "latest" release
        if: github.repository == 'MultiMote/meshcore-cardputer-adv'
        run: gh release upload latest out/* --repo MultiMote/meshcore-cardputer-adv --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Replace "latest" with current tag in file names
        if: github.ref_type == 'tag'
        run: |
          cd out
          for file in *latest*; do
            mv "$file" "${file//latest/${{ github.ref_name }}}"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          name: Firmware ${{ github.ref_name }}
          body: ""
          draft: true
          files: out/*
