name: Build firmware

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  MESHCORE_VERSION: v1.16.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          repository: 'meshcore-dev/meshcore'
          ref: companion-${{ env.MESHCORE_VERSION }}
          path: MeshCore

      - uses: actions/checkout@v6
        with:
          path: meshcore-cardputer-adv

      - name: Copy variant
        run: |
          cp -r meshcore-cardputer-adv/variants/cardputer_adv MeshCore/variants/

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Replace COMMIT_HASH in build.sh
        run: |
          sed -i -E 's/^([[:space:]]*)COMMIT_HASH=.*/\1COMMIT_HASH=latest/' MeshCore/build.sh

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.MESHCORE_VERSION }}
          DISABLE_DEBUG: 1
        run: /usr/bin/env bash build.sh build-firmware cardputer_adv_companion_radio_ble
        working-directory: MeshCore

      - name: Update GitHub "latest" release
        if: github.repository == 'MultiMote/meshcore-cardputer-adv'
        run: gh release upload latest MeshCore/out/* --repo MultiMote/meshcore-cardputer-adv --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Replace "latest" with current tag in file names
        if: github.ref_type == 'tag'
        run: |
          cd MeshCore/out
          for file in *latest*; do
            mv "$file" "${file//latest/${{ github.ref_name }}}"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          name: Firmware ${{ github.ref_name }}
          body: ""
          draft: true
          files: MeshCore/out/*
